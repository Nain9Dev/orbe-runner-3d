<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbe Runner 3D</title>
  <meta name="description" content="Videojuego 3D open source hecho desde cero: recoge los orbes, esquiva a los cazadores y sube de nivel. Sin instalar nada, juega en el navegador." />
  <meta name="theme-color" content="#0b1020" />

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Orbe Runner 3D" />
  <meta property="og:description" content="Videojuego 3D open source hecho desde cero. Juega en el navegador, sin instalar nada." />
  <meta property="og:url" content="https://orbe.naindev.com/" />
  <meta property="og:image" content="https://orbe.naindev.com/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%2305d9e8'/></svg>" />

  <!-- Elimina el import map, Vite resuelve three -->
  <script type="module" crossorigin src="./assets/index-CV2eQKx-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CtLWh4ju.css">
</head>
<body>
  <div id="damage-vignette"></div>
  <canvas id="game"></canvas>

  <!-- Controles Táctiles (solo móviles) -->
  <div id="touch-controls" class="hidden">
    <div id="touch-left-zone">
      <div id="touch-joystick-base" class="hidden">
        <div id="touch-joystick-stick"></div>
      </div>
    </div>
    <div id="touch-right-zone">
      <button id="touch-dash-btn" aria-label="Acelerón">💨</button>
      <button id="touch-jump-btn" aria-label="Saltar">⬆️</button>
    </div>
  </div>

  <!-- HUD: capa DOM independiente del render 3D -->
  <div id="hud">
    <!-- Esquina Superior Izquierda: Nivel y FPS -->
    <div class="hud-top-left">
      <div id="hud-level" class="hud-text">NIVEL 1</div>
      <div id="hud-fps" class="hud-subtext">-- FPS</div>
      <div id="hud-combo" class="hud-powerup-text" style="display: none; color: #ff2a6d; margin-top: 5px;">COMBO x2</div>
    </div>

    <!-- Centro Superior: Powerups -->
    <div class="hud-top-center">
      <div id="hud-powerup" class="hud-powerup-text" style="display: none;"></div>
    </div>

    <!-- Esquina Superior Derecha: Fragmentos -->
    <div class="hud-top-right">
      <div class="hud-text">FRAGMENTOS</div>
      <div id="hud-score" class="hud-value">0</div>
    </div>

    <!-- Centro: Retícula -->
    <div class="hud-reticle"></div>

    <!-- Centro Inferior: Barra de Vida -->
    <div class="hud-bottom-center">
      <div class="health-label">INTEGRIDAD DEL NÚCLEO</div>
      <div id="health-pips" class="health-bar-container" aria-label="Vidas de Lúmen">
        <!-- Pips geométricos generados por JS -->
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">LÚMEN</h1>
      <p id="overlay-text">Salva la luz. Recoge los fragmentos estelares y escapa de las Sombras.</p>
      
      <div class="controls-grid">
        <div class="control-key"><span>W A S D</span> MOVERSE</div>
        <div class="control-key"><span>ESPACIO</span> SALTAR</div>
        <div class="control-key"><span>SHIFT</span> DASH</div>
        <div class="control-key"><span>RATÓN</span> CÁMARA</div>
        <div class="control-key"><span>ESC</span> MENÚ/PAUSA</div>
      </div>

      <div class="panel-actions">
        <button id="start" class="btn-primary" disabled>CARGANDO...</button>
        <button id="btn-settings" class="btn-secondary">AJUSTES</button>
      </div>
    </div>
    
    <div id="settings-panel" class="panel hidden">
      <h1>Ajustes</h1>
      
      <div class="setting-group">
        <label>Nivel Inicial:</label>
        <div class="level-selector">
          <button id="lvl-down" class="btn-icon" aria-label="Bajar nivel">-</button>
          <span id="lvl-display" aria-live="polite">1</span>
          <button id="lvl-up" class="btn-icon" aria-label="Subir nivel">+</button>
        </div>
      </div>
      
      <div class="setting-group">
        <label>Color de Lúmen:</label>
        <div class="color-picker" id="color-picker" role="radiogroup" aria-label="Seleccionar color">
          <button class="color-btn active" data-color="0x6ee7ff" style="background: #6ee7ff; box-shadow: 0 0 10px #6ee7ff;" aria-label="Color Cyan" role="radio" aria-checked="true"></button>
          <button class="color-btn" data-color="0xff2a6d" style="background: #ff2a6d; box-shadow: 0 0 10px #ff2a6d;" aria-label="Color Rosa" role="radio" aria-checked="false"></button>
          <button class="color-btn" data-color="0xffc44d" style="background: #ffc44d; box-shadow: 0 0 10px #ffc44d;" aria-label="Color Amarillo" role="radio" aria-checked="false"></button>
          <button class="color-btn" data-color="0x39ff14" style="background: #39ff14; box-shadow: 0 0 10px #39ff14;" aria-label="Color Verde" role="radio" aria-checked="false"></button>
        </div>
      </div>

      <div class="setting-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label style="margin: 0;">Sonido</label>
        <button id="btn-sound" class="btn-toggle active" aria-label="Alternar sonido">ON</button>
      </div>

      <div class="setting-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label style="margin: 0;">Calidad Gráfica</label>
        <button id="btn-gfx" class="btn-toggle active" aria-label="Alternar gráficos altos o bajos">ALTA</button>
      </div>
      
      <button id="btn-save" class="btn-primary" style="margin-top: 30px; width: 100%;">VOLVER</button>
    </div>
  </div>

</body>
</html>
