<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbe Runner 3D</title>
  <meta name="description" content="Videojuego 3D open source hecho desde cero: recoge los orbes, esquiva a los cazadores y sube de nivel. Sin instalar nada, juega en el navegador." />
  <meta name="theme-color" content="#0b1020" />

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Orbe Runner 3D" />
  <meta property="og:description" content="Videojuego 3D open source hecho desde cero. Juega en el navegador, sin instalar nada." />
  <meta property="og:url" content="https://orbe.naindev.com/" />
  <meta property="og:image" content="https://orbe.naindev.com/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%2305d9e8'/></svg>" />

  <!-- Elimina el import map, Vite resuelve three -->
  <script type="module" crossorigin src="./assets/index-B3QZXN9S.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CI2v0fCI.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Controles Táctiles (solo móviles) -->
  <div id="touch-controls" class="hidden">
    <div id="touch-left-zone">
      <div id="touch-joystick-base" class="hidden">
        <div id="touch-joystick-stick"></div>
      </div>
    </div>
    <div id="touch-right-zone">
      <button id="touch-jump-btn" aria-label="Saltar">⬆️</button>
    </div>
  </div>

  <!-- HUD: capa DOM independiente del render 3D -->
  <div id="hud">
    <div class="hud-row">
      <span class="chip" id="hud-level">Nivel 1</span>
      <span class="chip" id="hud-score">Fragmentos 0/0</span>
      <span class="chip" id="hud-lives">Vidas 3</span>
      <span class="chip" id="hud-fps">-- FPS</span>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">Lúmen: Orbe Runner</h1>
      <p id="overlay-text">Salva la luz. Recoge los fragmentos estelares y escapa de las Sombras.</p>
      <ul class="keys">
        <li><b>WASD</b> moverse</li>
        <li><b>Espacio</b> saltar</li>
        <li><b>Ratón</b> girar cámara</li>
        <li><b>Esc</b> soltar el ratón</li>
      </ul>
      <div style="display: flex; gap: 16px; justify-content: center; margin-top: 20px;">
        <button id="start" disabled>Cargando...</button>
        <button id="btn-settings" class="btn-outline">⚙️ Ajustes</button>
      </div>
    </div>
    
    <div id="settings-panel" class="panel hidden">
      <h1>Ajustes</h1>
      
      <div class="setting-group">
        <label>Nivel Inicial:</label>
        <div class="level-selector">
          <button id="lvl-down" class="btn-icon">-</button>
          <span id="lvl-display">1</span>
          <button id="lvl-up" class="btn-icon">+</button>
        </div>
      </div>
      
      <div class="setting-group">
        <label>Color de Orbi:</label>
        <div class="color-picker" id="color-picker">
          <button class="color-btn active" data-color="0x6ee7ff" style="background: #6ee7ff; box-shadow: 0 0 10px #6ee7ff;"></button>
          <button class="color-btn" data-color="0xff2a6d" style="background: #ff2a6d; box-shadow: 0 0 10px #ff2a6d;"></button>
          <button class="color-btn" data-color="0xffc44d" style="background: #ffc44d; box-shadow: 0 0 10px #ffc44d;"></button>
          <button class="color-btn" data-color="0x39ff14" style="background: #39ff14; box-shadow: 0 0 10px #39ff14;"></button>
        </div>
      </div>
      
      <button id="btn-save" class="btn-outline" style="margin-top: 30px;">Guardar y Volver</button>
    </div>
  </div>

</body>
</html>
